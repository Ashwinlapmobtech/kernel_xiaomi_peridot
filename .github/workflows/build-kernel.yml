name: Build Peridot Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      O: out
      DEFCONFIG: vendor/peridot_GKI.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache bc flex bison libssl-dev \
          libelf-dev dwarves python3 wget gcc-aarch64-linux-gnu

    - name: Download Android Clang (r450784d)
      run: |
        mkdir -p prebuilts/clang/host/linux-x86
        cd prebuilts/clang/host/linux-x86
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz
        mkdir clang-r450784d
        tar -xf clang-r450784d.tar.gz -C clang-r450784d
        cd ../../../../

    - name: Configure kernel
      run: |
        mkdir -p $O
        make ARCH=${ARCH} O=${O} ${DEFCONFIG}

    - name: Build kernel
      run: |
        export PATH=$(pwd)/prebuilts/clang/host/linux-x86/clang-r450784d/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) ARCH=${ARCH} O=${O}

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp ${O}/arch/arm64/boot/Image.gz-dtb artifacts/ || true
        cp ${O}/arch/arm64/boot/Image artifacts/ || true
        cp ${O}/vmlinux artifacts/ || true
        mkdir -p artifacts/dtbs
        find ${O}/arch/arm64/boot/dts -name '*.dtb' -exec cp {} artifacts/dtbs/ \; || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: peridot-kernel
        path: artifacts
