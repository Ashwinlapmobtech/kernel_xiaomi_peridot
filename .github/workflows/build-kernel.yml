name: Build Peridot Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      O: out
      DEFCONFIG: vendor/peridot_GKI.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache bc flex bison libssl-dev \
          libelf-dev dwarves python3 wget gcc-aarch64-linux-gnu

    - name: Download Clang from Google Drive
      run: |
        mkdir -p prebuilts/clang/host/linux-x86/clang-r450784d
        wget --no-check-certificate "https://drive.google.com/uc?export=download&id=1fY3_y3GRwcBKD87K_AVaSblhwIgBVvl0" -O clang.tar.gz
        tar -xf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r450784d

    - name: Configure kernel
      run: |
        mkdir -p $O
        make ARCH=${ARCH} O=${O} ${DEFCONFIG}

    - name: Build kernel
      run: |
        export PATH=$(pwd)/prebuilts/clang/host/linux-x86/clang-r450784d/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) ARCH=${ARCH} O=${O}

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp ${O}/arch/arm64/boot/Image.gz-dtb artifacts/ || true
        cp ${O}/arch/arm64/boot/Image artifacts/ || true
        cp ${O}/vmlinux artifacts/ || true
        mkdir -p artifacts/dtbs
        find ${O}/arch/arm64/boot/dts -name '*.dtb' -exec cp {} artifacts/dtbs/ \; || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: peridot-kernel
        path: artifacts
