name: Build Peridot Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      O: out
      DEFCONFIG: vendor/peridot_defconfig

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache bc flex bison libssl-dev \
          libelf-dev dwarves python3 python3-pip wget clang llvm \
          gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        mkdir -p $O
        make ARCH=${ARCH} O=${O} ${DEFCONFIG}

    - name: Build kernel
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        make -j$(nproc) ARCH=${ARCH} O=${O}

    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp ${O}/arch/arm64/boot/Image artifacts/ || true
        cp ${O}/arch/arm64/boot/Image.gz-dtb artifacts/ || true
        cp ${O}/vmlinux artifacts/ || true
        mkdir -p artifacts/dtbs
        find ${O}/arch/arm64/boot/dts -name '*.dtb' -exec cp {} artifacts/dtbs/ \; || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: peridot-kernel
        path: artifacts
